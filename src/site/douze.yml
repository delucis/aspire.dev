# The Douze workflow of aspire.dev (docs/douze-migration-plan.md, section 3.2).
# Only the API reference branch is here so far (section 5); the articles, assets and checks are added later.
site:
  content: content
  data: data
  includes: templates
  url: https://aspire.dev

steps:
  # Site data: data/api/pkgs/Aspire.Hosting.13.6.0.json is api.pkgs["Aspire.Hosting.13.6.0"], data/api/routes/csharp-types.json
  # is api.routes["csharp-types"] (data/api is generated by scripts/api/build-api-index.ts).
  # The landing sidebars data/api/sidebar/{csharp,typescript}.json are left out: their names collide with the folders
  # data/api/sidebar/{csharp,typescript}/ (api.sidebar.csharp), and templates/api/sidebar.liquid composes them from the
  # per-package files.
  site-data:    { inputs: ["data/**/*.json", "!data/api/sidebar/csharp.json", "!data/api/sidebar/typescript.json"], uses: data, with: { scope: site } }

  # API reference: one template per route paginates its route list (size 1), the .html templates render the pages
  # and the *-md.html templates the Markdown twins (permalink: "{{ route.md }}", layout: false).
  api-pages:    { inputs: "content/reference/api/**", needs: site-data, uses: frontmatter }
  api-paginate: { needs: api-pages, uses: paginate }
  api-render:   { needs: api-paginate, uses: liquid, match: "**/*.html" }
  # The twins are Markdown: rendered without HTML encoding.
  api-render-md: { needs: api-render, uses: liquid, match: "**/*.md", with: { encode: none } }

  # Until the assets step exists: the API stylesheets and client scripts, written at their source path.
  api-assets:   { inputs: ["assets/css/api-*.css", "scripts/client/api/*.js"], uses: write }

  layout:       { needs: api-render-md, uses: layout, with: { includes: templates/layouts } }
  write:        { needs: layout, uses: write }
