# The Douze workflow of aspire.dev (docs/douze-migration-plan.md, section 3.2).
#
# Build: from src/site, after `node scripts/icons-sprite.mjs && node scripts/build-client.mjs && node scripts/build-css.mjs`
# (the icon sprite, the client bundle and the stylesheet; they write into assets/), run
#   douze -s src/site -o src/statichost/StaticHost/wwwroot
# Node (src/site/node_modules, `pnpm install` in src/site) runs the code highlighting worker (scripts/code-worker.mjs:
# Expressive Code with twoslash) and Pagefind.

site:
  content: content
  data: data
  includes: templates
  shortcodes: templates/shortcodes
  url: https://aspire.dev
  locales:
    default: en
    fallback: true                 # every untranslated page exists under every locale, as today
    languages:
      de: { label: Deutsch, lang: de }
      es: { label: Español, lang: es }
      ja: { label: 日本語, lang: ja }
      fr: { label: Français, lang: fr }
      it: { label: Italiano, lang: it }
      id: { label: Bahasa Indonesia, lang: id }
      zh-cn: { label: 简体中文, lang: zh-CN }
      pt-br: { label: Português do Brasil, lang: pt-BR }
      ko: { label: 한국어, lang: ko }
      tr: { label: Türkçe, lang: tr }
      ru: { label: Русский, lang: ru }
      hi: { label: हिन्दी, lang: hi }
      da: { label: Dansk, lang: da }
      uk: { label: Українська, lang: uk }

markdown:
  extensions: [pipetables, tasklists, attributes, autolinks, alerts, customcontainers, smartypants, strikethrough]
  aside: { class: starlight-aside, kinds: [note, tip, caution, danger, important], titles: { note: Note, tip: Tip, caution: Caution, danger: Danger, important: Important } }
  code: { passthrough: [mermaid] }
  images: { formats: [webp], quality: 82, output: assets/images }

steps:
  # Data. data/api/pkgs/Aspire.Hosting.13.6.0.json is api.pkgs["Aspire.Hosting.13.6.0"], data/api/routes/csharp-types.json
  # is api.routes["csharp-types"] (data/api is generated by scripts/api/build-api-index.ts). The two landing sidebar files
  # are left out: their names collide with the folders data/api/sidebar/{csharp,typescript}/ (templates/api/sidebar.liquid
  # composes them from the per-package files).
  site-data:    { inputs: ["data/**/*.{yml,json}", "!data/api/sidebar/csharp.json", "!data/api/sidebar/typescript.json"], uses: data, with: { scope: site } }
  folder-data:  { inputs: ["content/**/*.{yml,json}", "!content/icons/**", "!content/.well-known/**", "!content/reference/api/**"], uses: data, with: { scope: folder, root: content } }

  # Static assets, written as they are (fingerprinting comes with the assets step): the stylesheet, the client bundle,
  # the icon sprite, the fonts, the images referenced by the chrome, and the API client scripts at their source path.
  assets:       { inputs: ["assets/**", "scripts/client/api/*.js"], uses: write }

  # Articles. Paths after permalink are urls (content/ is stripped); the locale folders ja/, de/... are the first segment.
  pages:        { inputs: ["content/**", "!content/**/*.{yml,json}", "!content/reference/api/**", "!content/.well-known/**", "!content/icons/**", "!content/exports/**"], needs: [site-data, folder-data], uses: frontmatter }
  permalink:    { needs: pages, uses: permalink, with: { root: content } }
  collections:  { needs: permalink, uses: collect, match: ["**/*.md", "index.html"] }   # the root page is HTML
  localize:     { needs: [permalink, collections], uses: localize }
  og:           { needs: localize, uses: social-image, match: ["**/*.md", "!hub/**", "!reference/cli/includes/**"],
                  with: { template: og/card.svg.liquid, width: 1200, height: 630, output: "og{{ locale_url | append: 'x' | replace: '/x', '' }}.png",
                          skip: "og == false or ogImage or locale != 'en' or title == nil",
                          text: [ { value: "{{ seoTitle | default: title }}", font: "Outfit Bold 54", fontfile: assets/fonts/Outfit-Bold.ttf, x: 96, y: 232, width: 1008, height: 150, color: "#ffffff", align: left },
                                  { value: "{{ description | strip_markdown | truncate: 180 }}", font: "Outfit 30", fontfile: assets/fonts/Outfit-Regular.ttf, x: 96, y: 392, width: 1008, height: 96, color: "#dcd5f6", align: left } ] } }
  paginate:     { needs: og, uses: paginate }
  render:       { needs: paginate, uses: liquid }             # pages, the hub and samples templates, the *.liquid output templates
  versions:     { needs: render, uses: replace, with: { tokens: { "%ASPIRE_VERSION%": "{{ site.versions.aspire }}", "%ASPIRE_VERSION_MAJOR_MINOR%": "{{ site.versions.majorMinor }}", "%ASPIRE_VERSION_PREVIEW%": "{{ site.versions.preview }}" } } }
  # Markdown twins at StaticHost's paths: /get-started/x/ -> /get-started/x.md, / -> /index.md, /ja/ -> /ja.md.
  # Twins of the root locale's pages, of the translated ja pages and of every locale's home page, as before.
  twins:        { needs: versions, uses: fork, match: ["**/*.md", "!da/**", "!de/**", "!es/**", "!fr/**", "!hi/**", "!id/**", "!it/**", "!ko/**", "!pt-br/**", "!ru/**", "!tr/**", "!uk/**", "!zh-cn/**", "{da,de,es,fr,hi,id,it,ko,pt-br,ru,tr,uk,zh-cn}/index.md"], with: { permalink: "{% if url == '/index.html' %}/index.md{% else %}{{ url | replace: '/index.html', '.md' }}{% endif %}", data: { markdown: false, layout: false, twin: true }, content: "# {{ title }}\n\n{{ content }}" } }
  markdown:     { needs: twins, uses: markdown }
  # The home pages have no heading anchors (their sections are components).
  headings:     { needs: markdown, uses: headings, match: ["**/*.html", "!index.html", "!{da,de,es,fr,hi,id,it,ja,ko,pt-br,ru,tr,uk,zh-cn}/index.html"], with: { anchors: true, wrapper-class: sl-heading-wrapper, anchor-class: sl-anchor-link, levels: [2, 3], skip-classes: [not-content] } }   # component headings are not the page's
  code:         { needs: headings, run: "node scripts/code-worker.mjs", mode: worker, match: "**/*.html", sources: ["scripts/code-worker.mjs", "scripts/douze-worker.mjs", "ec.config.mjs", "data/twoslash/**", "data/i18n/*.json"], with: { cache: .douze/code-cache }, env: { NODE_NO_WARNINGS: "1" }, stderr: warn }

  # API reference: one template per route paginates its route list (size 1); the .html templates render the pages, the
  # *-md.html templates the Markdown twins (permalink: "{{ route.md }}", layout: false, rendered without HTML encoding).
  # Not `needs: collections`: a step needing a reduce step also receives the files it passes through, and the pages
  # would reach `layout` twice. The "Learn more" diagnostics links of experimental types need collections.urls: later.
  api-pages:    { inputs: "content/reference/api/**", needs: site-data, uses: frontmatter }
  api-paginate: { needs: api-pages, uses: paginate }
  api-render:   { needs: api-paginate, uses: liquid, match: "**/*.html" }
  api-render-md: { needs: api-render, uses: liquid, match: "**/*.md", with: { encode: none } }

  # Chrome, then the output folder; Pagefind indexes the articles after the write.
  layout:       { needs: [code, api-render-md], uses: layout, with: { includes: templates/layouts } }
  # Static files of the content folder that the pages step leaves out (JSON is data there): the Mermaid icon pack
  # (scripts/client/from-frontend/config/icon-packs.mjs loads /icons/aspire.json).
  static:       { inputs: ["content/icons/**"], uses: permalink, with: { root: content } }
  write:        { needs: [layout, assets, static], uses: write }
  # The CLI is lib/runner/bin.cjs (lib/index.js is the Node API and does nothing when run); --glob takes one pattern.
  search:       { needs: write, run: "node node_modules/pagefind/lib/runner/bin.cjs --site {{ site }} --glob \"{index.html,app-host/**/*.html,architecture/**/*.html,aspireconf/**/*.html,community/**/*.html,dashboard/**/*.html,deployment/**/*.html,diagnostics/**/*.html,extensibility/**/*.html,fundamentals/**/*.html,get-started/**/*.html,integrations/**/*.html,languages-and-runtimes/**/*.html,reference/**/*.html,testing/**/*.html,whats-new/**/*.html,hub/**/*.html}\"", timeout: 20m, stderr: warn }
